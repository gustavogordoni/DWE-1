<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando</title>
    <link rel="stylesheet" href="../assets/bootstrap.css">
</head>

<body class="container">
    <h1><strong>Praticando 1 - JavaScript</strong></h1>

    <h2 id="welcome">Seja bem-vindo</h2>

    <br>
    <button class="btn btn-primary" onclick="add()">Adicionar texto (parágrafo de Lorem Ipsum)</button>
    <br><br>
    <button class="btn btn-primary" onclick="removeAll()">Remover texto (todos os parágrafos)</button>

    <br><br><br>
    <div id="textos"></div>

    <script>
        const nome = prompt("Qual é o seu nome?");

        if (nome !== null && nome.trim() !== "") {
            const welcome = document.getElementById("welcome");
            const strong = document.createElement("strong");
            strong.textContent = nome;

            welcome.textContent = "Seja bem-vindo ";
            welcome.appendChild(strong);
        }

        function add() {
            const textos = document.getElementById("textos");

            const p = document.createElement("p");
            p.textContent = "Lorem ipsum dolor sit, amet consectetur adipisicing elit. Excepturi expedita minus corrupti pariatur nobis earum natus iusto consectetur, laborum saepe voluptatibus.";
            p.style.fontSize = "20px";

            textos.appendChild(p);
        }

        function removeAll() {
            document.querySelectorAll("#textos p").forEach(function (p) {
                p.remove();
            });
        }
    </script>
</body>

</html>
