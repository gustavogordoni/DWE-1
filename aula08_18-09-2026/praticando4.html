<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando 4 - Caixas Verdes</title>

    <style>
        div {

        .text-end {

        }

        .float-left {

        }

        .div1 {
            width: 110px;
            height: 110px;
        }

        .div2 {
            width: 350px;
            height: 110px;

        }

        .div3 {
            height: 350px;
            width: 110px;

        }
    </style>
</head>

<body>
    <h1>Praticando 4 - Caixas Verdes</h1>

    <section class="text-end">
        <div class="div1"></div>
        <div class="div1"></div>
        <div class="div1"></div>
    </section>

    <br>

    <div class="div2"></div>
    <div class="div2"></div>

    <br>

    <section class="text-end">
        <div class="div3"></div>
        <div class="div3"></div>
        <div class="div3 float-left"></div>
    </section>
</body>

</html>
